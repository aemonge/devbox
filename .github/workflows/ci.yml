name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    name: lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install gate tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt bats

      - name: Lint (shellcheck — zero findings)
        run: just lint

      - name: Format check (shfmt diff-clean)
        run: just fmt-check

      - name: Test (bats suites)
        run: just test

      # No sandbox launches: devbox's runtime gates (--validate on a capable
      # host) stay a human host-side step by design; CI gates the shell code.
